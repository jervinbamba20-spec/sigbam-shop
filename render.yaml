# Render Blueprint: deploys the Strapi 5 backend + a free PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repository.
# The Nuxt frontend is deployed separately on Vercel (see README.md).

databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce

services:
  - type: web
    name: ecommerce-strapi
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # Database: Render injects the internal connection string
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      # Strapi secrets: Render generates random values
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Image storage: Render's disk is wiped on restart, so use Cloudinary.
      # You will be asked to paste these values when creating the Blueprint.
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      # Optional: your Vercel URL, e.g. https://sigbam-shop.vercel.app
      - key: CORS_ORIGINS
        sync: false
